<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Intro component with sign up form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
  <section>
   <div class="container">
     
     <div class="left">
       <div class="header">Learn to code by watching others</div>
       <p>
         See how experienced developers solve problems in real-time. Watching scripted tutorials is great,
         but understanding how developers think is invaluable.
       </p>
     </div>
     <div class="right">
       <div class="try"><strong>Try it free 7 days</strong> then $20/mo. thereafter</div>
       <form action="">
         <input type="text" placeholder="First Name" class="firstName" required>
         <input type="text" placeholder="Second Name" required>
         <input type="email" placeholder="Enter your email" required>
         <input type="password" placeholder="Enter Password" required>
         <button>Claim your free trial</button>
         <p>By clicking the button, you are agreeing to our<a href="" style="outline: none; border: none;"><strong> Terms and Services</strong></a></p>
         
       </form>
     </div>
   </div>
  </section>
  </main>
  <script src="script.js"></script>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const inputs = document.querySelectorAll('form input');
      inputs.forEach(input => {
        const errorMessage = input.nextElementSibling;
        if (input.value.trim() === '') {
          if (!errorMessage || !errorMessage.classList.contains('error-message')) {
            const error = document.createElement('p');
            error.textContent = `${input.placeholder} field cannot be empty`;
            error.style.color = 'red';
            error.classList.add('error-message');
            input.insertAdjacentElement('afterend', error);
          }
        } else {
          if (errorMessage && errorMessage.classList.contains('error-message')) {
            errorMessage.remove();
          }
        }
      });
    });
  </script>
</body>
</html>
