<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="Styles.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-image">
      <img src="./images/image-equilibrium.jpg" alt="Equilibrium Cube" />
      <div class="overlay">
        <img src="./images/icon-view.svg" alt="View Icon" class="view-icon" />
      </div>
    </div>
    <div class="card-body">
      <h3 class="title">Equilibrium <span>#3429</span></h3>
      <p class="description">Our Equilibrium collection promotes balance and calm.</p>
      <div class="card-info">
        <div class="price">
          <img src="./images/icon-ethereum.svg" alt="ETH" />
          <span>0.041 ETH</span>
        </div>
        <div class="time-left">
          <img src="./images/icon-clock.svg" alt="Clock" />
          <span>3 days left</span>
        </div>
      </div>
      <div class="creator">
        <img src="./images/image-avatar.png" alt="Creator" />
        <p>Creation of <span>Jules Wyvern</span></p>
      </div>
    </div>
  </div>
</body>
</html>
